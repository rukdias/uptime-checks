name: Smoke

# Daily read-only browser smoke tests of the production apps (tests/*.spec.ts).
# A failing run opens (or comments on) an issue labelled "smoke"; the next
# passing run comments and closes it. Same pattern as uptime.yml.
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
  # TEMPORARY: workflow_dispatch only works once this file is on main, so a
  # push to this branch runs it for verification. Remove before merging.
  push:
    branches: [smoke-tests]

concurrency:
  group: smoke
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run smoke tests
        id: smoke
        run: npx playwright test
        continue-on-error: true
      - name: Upload HTML report
        if: steps.smoke.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Open, update or close the smoke issue
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.smoke.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create smoke --color D93F0B --description "A browser smoke test is failing" 2>/dev/null || true
          open=$(gh issue list --label smoke --state open --json number --jq '.[0].number // empty')
          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "Recovered: all smoke tests passing. $RUN_URL"
              gh issue close "$open"
            fi
          else
            node scripts/smoke-summary.mjs results.json
            body="$(cat smoke-report.md)"$'\n\n'"Run (HTML report under Artifacts): $RUN_URL"
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "$body"
            else
              gh issue create --title "Smoke tests failing" --label smoke --body "$body"
            fi
          fi
      - name: Fail the run when a smoke test failed
        if: steps.smoke.outcome != 'success'
        run: exit 1
